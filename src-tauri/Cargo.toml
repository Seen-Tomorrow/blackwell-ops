[package]
name = "blackwell-ops"
version = "1.0.72"
edition = "2021"

[[bin]]
name = "blackwell-ops"
path = "src/main.rs"

[features]
default = []

[dependencies]
# Floor = the version this app is actually built and tested against, so a deleted
# Cargo.lock cannot silently drop below the Tauri pair that package.json pins
# (`tauri build` gates crate vs @tauri-apps/* major/minor — keep the two in step).
tauri = { version = "2.12.1", features = [] }
tauri-plugin-shell = "2.4.0"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
chrono = "0.4"
# `std` explicitly: `set_boxed_logger` is gated on it, and the feature does not arrive
# on its own through the tauri dependency graph.
log = { version = "0.4", features = ["std"] }
rfd = "0.17"
# No `multithread`: every one of its 13 cfg sites in sysinfo 0.38 lives under
# src/unix/ (linux, apple, bsd). The Windows backend has zero — CPU sampling goes
# through PDH single-threaded regardless. It was enabled on 2026-10-01 to "preserve
# HW-monitor refresh behavior on the 32-core box", but on Windows there is no parallel
# refresh to preserve; the feature only pulls rayon into the graph.
sysinfo = "0.38"
sha2 = "0.11"
libloading = "0.9"
regex = "1.10"
parking_lot = "0.12"
futures-util = "0.3"
trash = "5"
percent-encoding = "2"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Performance", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_JobObjects"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
# Day-to-day rebuilds: thin debuginfo -> much faster rust-lld links; full +0 still
# available via CARGO_PROFILE_DEV_DEBUG=2 when deep-debugging.
debug = "line-tables-only"
# Parallel monomorphization/codegen inside the huge binary crate (default 256).
# Keep high so the final blackwell-ops unit can use the 32-core box.
codegen-units = 256

[profile.release]
opt-level = 3
# Prefer link speed over last-percent runtime; pack/ship does many clean release builds.
lto = false
codegen-units = 32
panic = "abort"
# No PDB tax on release links unless explicitly debugging a REL build.
debug = false
