[package]
name = "oym-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OYM Link: portable device link and local assistant"

[[bin]]
name = "oym-link"
path = "src/main.rs"

[dependencies]
oym-gateway = { path = "../gateway" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
base64 = "0.22"
rand = "0.8"
hex = "0.4"
http = "1"
url = "2"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
