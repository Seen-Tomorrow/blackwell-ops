[package]
name = "oym-link-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OYM Link tray application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oym-link-core = { path = "../../core" }
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
