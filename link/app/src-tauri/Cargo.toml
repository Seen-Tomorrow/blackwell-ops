[package]
name = "oym-link-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OYM Link tray application"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oym-link-core = { path = "../../core" }
portable-pty = "0.9"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
