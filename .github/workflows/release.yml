name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.36)"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

env:
  npm_config_cache: .npm
  CARGO_NET_GIT_FETCH_WITH_CLI: 1

jobs:
  prepare:
    name: Bump & Prepare
    runs-on: windows-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dbushe/rust-musl-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install Tauri deps
        run: |
          choco install -y nsis
          npm install --global @tauri-apps/cli@2

      - name: Determine version
        id: bump
        run: |
          if "${{ inputs.version }}" != "" && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VER="${TAG#v}"
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Bump version in package.json and tauri.conf.json
        run: |
          $ver = "${{ steps.bump.outputs.version }}"
          (Get-Content package.json) -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`"" | Set-Content package.json
          (Get-Content src-tauri/tauri.conf.json) -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`"" | Set-Content src-tauri/tauri.conf.json

      - name: Commit & tag (push trigger)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json
          git commit -m "chore(release): bump v${{ steps.bump.outputs.version }}" || true

      - name: Build frontend
        run: npm ci && npm run build:frontend

      - name: Run mirror-artifacts
        run: powershell -ExecutionPolicy Bypass -File scripts/mirror-artifacts.ps1

      - name: Run prepare-release-runtime
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-release-runtime.ps1

      - name: Tauri build
        run: npm run release:exe

      - name: Run majestic ship check
        run: |
          npm run majestic:check:app -Variant app

      - name: Package app archive + update manifest
        run: |
          $ver = "${{ steps.bump.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File scripts/pack-app-update.ps1 -Version $ver

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/dist/
            *.7z
            *updater.json

  publish:
    name: Publish Release
    needs: prepare
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Blackwell Ops v${{ needs.prepare.outputs.version }}"
          body_path: .github/release-template.md
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.7z
            artifacts/**/updater.json

      - name: Update in-app updater manifest
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $relNotes = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          # Upload updater.json to S3-compatible or gh release asset
          # The app currently downloads from GIT repo — this is placeholder for CDN
          echo "Release $tag published"

  nightly:
    name: Nightly Dev Build
    runs-on: windows-latest
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + Rust
        uses: turbocharger/setup-tauri@v2
        with:
          node-version: 22
          tauri-bundle-identifier: com.blackwell-ops.app

      - name: Install NSIS
        run: choco install nsis

      - name: Build
        run: |
          npm ci
          npm run release:exe
          npm run majestic:pack:app

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackwell-ops-nightly
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/dist/
          retention-days: 3
