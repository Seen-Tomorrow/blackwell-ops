name: Dependabot triage

# The Link app's glib 0.18 comes from Tauri's Linux gtk stack and is never compiled
# in the Windows product; gtk 0.20 (which would need glib 0.20) is not available in
# Tauri's Linux stack yet. Dependabot re-creates the alert on lockfile updates, and
# dependabot.yml `ignore` does not cover security alerts, so dismiss that one alert
# whenever it reappears.
#
# Remove this workflow when the Link app moves to a gtk/glib stack that carries the fix.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dismiss-glib:
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss the Linux-only glib alert on the Link app lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t alerts < <(
            gh api --paginate "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
              --jq '.[] | select(.dependency.package.ecosystem == "rust")
                          | select(.dependency.package.name == "glib")
                          | select(.dependency.manifest_path == "link/app/src-tauri/Cargo.lock")
                          | .number'
          )
          if [ "${#alerts[@]}" -eq 0 ]; then
            echo "No open glib alert."
            exit 0
          fi
          for n in "${alerts[@]}"; do
            gh api -X PATCH "repos/$REPO/dependabot/alerts/$n" \
              -f state=dismissed \
              -f dismissed_reason=not_used \
              -f dismissed_comment="Linux-target glib 0.18 via Tauri/gtk; not compiled in Windows builds. gtk 0.20 is not available in Tauri's Linux stack yet."
            echo "Dismissed Dependabot alert #$n"
          done
