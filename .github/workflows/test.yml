name: test

# Both suites in one job: a Windows runner costs more to boot than the suites take
# to run, and `cargo test` needs the frontend build anyway — tauri's
# `generate_context!` reads `build.frontendDist` at compile time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  npm_config_cache: .npm
  # Must be `true`, not `1` — cargo rejects any other value, and then every
  # registry lookup dies with "provided string was not `true` or `false`".
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: Frontend + Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # First, so a broken frontend test fails in ~1 minute instead of ~15.
      - name: Frontend suite
        run: npm test

      - name: Build frontend
        run: npm run build:frontend

      # CSS gates: the canonical src/index.css partial order and the lightningcss
      # minify pass. Size and paint counts are printed for drift visibility but are
      # deliberately NOT ceilings (the 2026-10 reduction campaign is closed). Runs
      # AFTER the build so the reported dist numbers describe real output.
      - name: CSS gates
        run: npm run css:audit

      # tauri.conf.json bundles four directories and two are gitignored by design:
      # `runtime-bundle/` (engine binaries) and `pi-ext/` (the 1171-file
      # pi-subagents tree, vendored by Harness UPDATE). tauri-build validates every
      # resource path before compiling, so without them the crate cannot build at
      # all — `cargo test` dies in the build script, never reaching a test.
      # No test reads these trees, so fabricate them. This workflow publishes
      # nothing, and the real release path (scripts/prepare-release-*.ps1) still
      # hard-exits when the real trees are missing, so a stub can never reach an
      # installer.
      - name: Fabricate gitignored bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/runtime-bundle, src-tauri/pi-ext/pi-subagents | Out-Null
          Set-Content src-tauri/runtime-bundle/.ci-placeholder "placeholder"
          Set-Content src-tauri/pi-ext/pi-subagents/package.json '{"name":"pi-subagents","version":"0.0.0-ci"}'

      # Pinned, and pinned to the same version as rust-toolchain.toml. The compiler
      # is what runs the 65 build scripts + 19 proc macros in the Windows graph, so
      # a floating `stable` is a wider door than any single crate.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --locked: cargo must refuse to re-resolve rather than silently adopt a new
      # semver-compatible release of any of the 285 crates this target builds.
      - name: Rust suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # Belt and braces — nothing above is allowed to rewrite the pin.
      - name: Assert Cargo.lock unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock
